; PHP-FPM Pool Configuration for Armbian Linux (Amlogic S905W - 1.87 GB RAM)
; Path: /etc/php/8.2/fpm/pool.d/www.conf

[www]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Kiểu quản lý dynamic tối ưu bộ nhớ
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Thu hồi worker sau 500 request để ngăn chặn triệt để rò rỉ RAM (memory leaks)
pm.max_requests = 500

; Giới hạn thời gian thực thi (tránh treo worker vô hạn do database lock)
request_terminate_timeout = 30s

; Giới hạn bộ nhớ tối đa cho mỗi worker (Laravel thông thường dùng 25-35MB)
php_admin_value[memory_limit] = 128M

; Log lỗi PHP
php_admin_value[error_log] = /var/log/php8.2-fpm.log
php_admin_flag[log_errors] = on
