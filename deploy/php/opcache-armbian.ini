; OPcache Configuration for Armbian Linux (Amlogic S905W)
; Path: /etc/php/8.2/mods-available/opcache.ini

zend_extension=opcache.so
opcache.enable=1
opcache.enable_cli=0

; Bộ nhớ chia sẻ cho opcode cache (64 MB là dư dả cho toàn bộ source Laravel)
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000

; Trên Production: Tắt validate timestamps để loại bỏ triệt để các lệnh stat() đọc đĩa eMMC
opcache.validate_timestamps=0
opcache.revalidate_freq=0

opcache.save_comments=1
opcache.fast_shutdown=1
