# Nginx Configuration for Learn-Chinese on Armbian (Amlogic S905W)
# Path: /etc/nginx/sites-available/learn-chinese.conf

# Rate limit zone: Chống burst/spam quá mức lên endpoint polling (5 requests/sec per IP)
limit_req_zone $binary_remote_addr zone=duel_poll:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/Learn-Chinese/public;
    index index.php index.html;
    charset utf-8;

    # Nén Gzip tối ưu băng thông cho client mobile
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;
    gzip_min_length 256;

    # Headers bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # State Polling của Chinese Duel: Áp dụng rate limiting nhẹ nhàng với burst
    location ~* ^/duel/room/[^/]+/state$ {
        limit_req zone=duel_poll burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Xử lý PHP qua PHP-FPM Unix Socket
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Bộ đệm FastCGI tiết kiệm RAM cho Amlogic S905W
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 30s;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
    }

    # Cache tĩnh cho tài nguyên hình ảnh, font, JS, CSS (Giảm tải I/O eMMC)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Chặn truy cập các file ẩn (.git, .env, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
