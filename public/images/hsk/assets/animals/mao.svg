  <line x1="42" y1="59" x2="32" y2="61" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="55" x2="88" y2="53" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="59" x2="88" y2="61" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
