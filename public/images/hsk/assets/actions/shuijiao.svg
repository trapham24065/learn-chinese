<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Sleeping Zzz / Moon in night sky -->
  <path d="M84 22 a12 12 0 1 0 12 12 a10 10 0 0 1 -12 -12 z" fill="#fbbf24"/>
  <text x="64" y="32" font-family="sans-serif" font-weight="900" font-size="12" fill="#818cf8">Z</text>
  <text x="72" y="24" font-family="sans-serif" font-weight="900" font-size="16" fill="#6366f1">Z</text>
  <!-- Bed Headboard -->
  <rect x="20" y="48" width="12" height="46" rx="4" fill="#64748b"/>
  <!-- Bed Frame -->
  <rect x="24" y="74" width="76" height="14" rx="3" fill="#475569"/>
  <!-- Bed Legs -->
  <rect x="24" y="88" width="8" height="12" rx="2" fill="#334155"/>
  <rect x="92" y="88" width="8" height="12" rx="2" fill="#334155"/>
  <!-- Pillow -->
  <rect x="32" y="58" width="22" height="16" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Sleeping character head -->
  <circle cx="43" cy="65" r="9" fill="#fed7aa"/>
  <path d="M40 65 q3 2 6 0" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <!-- Blanket covering bed -->
  <path d="M48 64 h48 c4 0 6 3 6 8 v6 h-54 z" fill="#3b82f6"/>
  <path d="M48 64 h10 v20 h-10 z" fill="#93c5fd"/>
</svg>
