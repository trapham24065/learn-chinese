<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="glasses_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#glasses_bg)"/>
  <!-- Glasses frames -->
  <!-- Left lens -->
  <rect x="22" y="46" width="30" height="28" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="4"/>
  <path d="M28,52 L42,52" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Right lens -->
  <rect x="68" y="46" width="30" height="28" rx="8" fill="#e0f2fe" stroke="#0f172a" stroke-width="4"/>
  <path d="M74,52 L88,52" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose bridge -->
  <path d="M52,54 Q60,48 68,54" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Left temple arm -->
  <path d="M22,50 L12,42 Q8,40 10,48" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <!-- Right temple arm -->
  <path d="M98,50 L108,42 Q112,40 110,48" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <!-- Shadow -->
