<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Ground line -->
  <line x1="16" y1="96" x2="104" y2="96" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="34" cy="80" r="16" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="34" cy="80" r="3" fill="#64748b"/>
  <circle cx="86" cy="80" r="16" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="86" cy="80" r="3" fill="#64748b"/>
  <!-- Frame triangles -->
  <!-- Bottom bracket (crank) at (56, 80) -->
  <path d="M34 80 L56 80 L76 56 L44 56 Z" fill="none" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M56 80 L44 56" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <path d="M56 80 L52 48" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <!-- Fork to front wheel -->
  <path d="M86 80 L74 46" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <!-- Handlebars -->
  <path d="M70 46 h12" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Saddle -->
  <path d="M44 48 h16" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Pedals -->
  <circle cx="56" cy="80" r="5" fill="#f59e0b"/>
</svg>
