<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="med_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#med_bg)"/>
  <!-- Syringe angled -->
  <g transform="rotate(45 60 60)">
    <!-- Plunger -->
    <rect x="58" y="10" width="4" height="24" rx="1" fill="#64748b"/>
    <rect x="50" y="8" width="20" height="4" rx="2" fill="#475569"/>
    <!-- Stopper -->
    <rect x="53" y="32" width="14" height="6" rx="1" fill="#0284c7"/>
    <!-- Syringe Barrel -->
    <rect x="52" y="36" width="16" height="46" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <!-- Measurement lines -->
    <line x1="53" y1="46" x2="59" y2="46" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="53" y1="54" x2="61" y2="54" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="53" y1="62" x2="59" y2="62" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="53" y1="70" x2="61" y2="70" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Liquid inside -->
    <rect x="54" y="52" width="12" height="28" fill="#38bdf8" opacity="0.6"/>
    <!-- Tip & needle -->
    <rect x="57" y="82" width="6" height="6" fill="#0284c7"/>
    <line x1="60" y1="88" x2="60" y2="108" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Drops -->
    <circle cx="60" cy="114" r="2" fill="#0284c7"/>
  </g>
</svg>
