<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="hotel_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#hotel_bg)"/>
  <!-- Hotel building -->
  <rect x="26" y="24" width="68" height="82" rx="4" fill="#334155"/>
  <polygon points="60,12 22,25 98,25" fill="#1e293b"/>
  <!-- Hotel sign emblem (H inside circle) -->
  <circle cx="60" cy="34" r="7" fill="#fbbf24"/>
  <path d="M57,30 L57,38 M63,30 L63,38 M57,34 L63,34" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Windows rows -->
  <rect x="34" y="46" width="10" height="12" rx="2" fill="#fef08a"/>
  <rect x="55" y="46" width="10" height="12" rx="2" fill="#fef08a"/>
  <rect x="76" y="46" width="10" height="12" rx="2" fill="#93c5fd"/>
  <rect x="34" y="64" width="10" height="12" rx="2" fill="#93c5fd"/>
  <rect x="55" y="64" width="10" height="12" rx="2" fill="#fef08a"/>
  <rect x="76" y="64" width="10" height="12" rx="2" fill="#fef08a"/>
  <!-- Entrance door -->
  <rect x="50" y="86" width="20" height="20" rx="2" fill="#60a5fa"/>
  <line x1="60" y1="86" x2="60" y2="106" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Ground -->
  <line x1="10" y1="106" x2="110" y2="106" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
</svg>
