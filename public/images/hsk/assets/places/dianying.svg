<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Cinema Clapperboard -->
  <!-- Bottom board -->
  <rect x="26" y="48" width="68" height="48" rx="6" fill="#1e293b"/>
  <!-- Clapper top board (tilted slightly) -->
  <g transform="translate(26, 48) rotate(-14) translate(-26, -48)">
    <rect x="26" y="32" width="68" height="16" rx="3" fill="#1e293b"/>
    <!-- Stripes -->
    <polygon points="34,32 42,32 36,48 28,48" fill="#ffffff"/>
    <polygon points="50,32 58,32 52,48 44,48" fill="#ffffff"/>
    <polygon points="66,32 74,32 68,48 60,48" fill="#ffffff"/>
    <polygon points="82,32 90,32 84,48 76,48" fill="#ffffff"/>
  </g>
  <!-- Board details lines -->
  <line x1="36" y1="62" x2="84" y2="62" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="72" x2="74" y2="72" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Film Play Icon -->
  <polygon points="56,78 68,85 56,92" fill="#f59e0b"/>
</svg>
