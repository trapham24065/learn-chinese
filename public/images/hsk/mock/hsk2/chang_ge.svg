<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Microphone stand base -->
  <ellipse cx="50" cy="98" rx="24" ry="6" fill="#cbd5e1"/>
  <!-- Stand pole -->
  <line x1="50" y1="96" x2="50" y2="60" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <!-- Mic Head -->
  <rect x="42" y="24" width="16" height="28" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <!-- Mesh lines on mic -->
  <line x1="44" y1="32" x2="56" y2="32" stroke="#94a3b8" stroke-width="2"/>
  <line x1="44" y1="38" x2="56" y2="38" stroke="#94a3b8" stroke-width="2"/>
  <line x1="44" y1="44" x2="56" y2="44" stroke="#94a3b8" stroke-width="2"/>
  <!-- Mic U-shaped mount -->
  <path d="M36 36 c0 16 28 16 28 0" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="50" y2="60" stroke="#334155" stroke-width="4"/>
  <!-- Musical Notes ♪ ♫ -->
  <!-- Note 1 -->
  <g fill="#ec4899">
    <ellipse cx="78" cy="40" rx="5" ry="4" transform="rotate(-20 78 40)"/>
    <line x1="82" y1="38" x2="82" y2="20" stroke="#ec4899" stroke-width="2.5"/>
    <path d="M82 20 c4 2 8 0 10 -4" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Note 2 -->
  <g fill="#8b5cf6">
    <ellipse cx="88" cy="62" rx="4.5" ry="3.5" transform="rotate(-20 88 62)"/>
    <ellipse cx="102" cy="58" rx="4.5" ry="3.5" transform="rotate(-20 102 58)"/>
    <line x1="92" y1="60" x2="92" y2="44" stroke="#8b5cf6" stroke-width="2.5"/>
    <line x1="106" y1="56" x2="106" y2="40" stroke="#8b5cf6" stroke-width="2.5"/>
    <polygon points="91,44 107,40 107,44 91,48" fill="#8b5cf6"/>
  </g>
</svg>
