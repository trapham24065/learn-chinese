<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Watch Straps -->
  <rect x="48" y="14" width="24" height="28" rx="4" fill="#78350f"/>
  <rect x="48" y="78" width="24" height="28" rx="4" fill="#78350f"/>
  <!-- Strap stitch marks -->
  <line x1="51" y1="16" x2="51" y2="40" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="69" y1="16" x2="69" y2="40" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="51" y1="80" x2="51" y2="104" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="69" y1="80" x2="69" y2="104" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Watch Case (Gold/Bronze bezel) -->
  <circle cx="60" cy="60" r="26" fill="#f59e0b"/>
  <!-- Winder Crown -->
  <rect x="85" y="57" width="5" height="6" rx="1.5" fill="#d97706"/>
  <!-- Watch Face / Dial -->
  <circle cx="60" cy="60" r="22" fill="#ffffff"/>
  <!-- Hour tick marks (12, 3, 6, 9) -->
  <line x1="60" y1="41" x2="60" y2="45" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="79" y1="60" x2="75" y2="60" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="79" x2="60" y2="75" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="60" x2="45" y2="60" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Watch Hands (pointing to ~10:10) -->
  <line x1="60" y1="60" x2="48" y2="49" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="72" y2="50" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="60" cy="60" r="3" fill="#dc2626"/>
</svg>
