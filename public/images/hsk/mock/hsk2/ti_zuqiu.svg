<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Grass ground patch -->
  <ellipse cx="60" cy="98" rx="42" ry="6" fill="#86efac"/>
  <!-- Soccer Ball -->
  <g transform="translate(68, 52)">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Center pentagon -->
    <polygon points="20,13 26,17 24,24 16,24 14,17" fill="#1e293b"/>
    <!-- Edge pentagons & seams -->
    <line x1="20" y1="13" x2="20" y2="3" stroke="#1e293b" stroke-width="2"/>
    <line x1="26" y1="17" x2="35" y2="13" stroke="#1e293b" stroke-width="2"/>
    <line x1="24" y1="24" x2="31" y2="32" stroke="#1e293b" stroke-width="2"/>
    <line x1="16" y1="24" x2="9" y2="32" stroke="#1e293b" stroke-width="2"/>
    <line x1="14" y1="17" x2="5" y2="13" stroke="#1e293b" stroke-width="2"/>
  </g>
  <!-- Kicking Leg & Boot -->
  <path d="M22 28 l18 26 l-6 24 l26 8" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sport Shoe / Cleat -->
  <path d="M60 84 l12 4 c3 1 3 4 0 5 l-16 1 c-3 0 -5 -2 -4 -5 z" fill="#dc2626"/>
  <!-- Kick action swooshes -->
  <path d="M66 74 c4 -8 14 -10 22 -6" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M72 82 c6 -4 14 -4 20 0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
</svg>
