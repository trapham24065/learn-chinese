<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Ground base -->
  <line x1="16" y1="104" x2="104" y2="104" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Secondary background building -->
  <rect x="68" y="38" width="30" height="66" rx="3" fill="#94a3b8"/>
  <rect x="74" y="44" width="6" height="6" fill="#f8fafc"/>
  <rect x="84" y="44" width="6" height="6" fill="#f8fafc"/>
  <rect x="74" y="56" width="6" height="6" fill="#f8fafc"/>
  <rect x="84" y="56" width="6" height="6" fill="#f8fafc"/>
  <rect x="74" y="68" width="6" height="6" fill="#f8fafc"/>
  <rect x="84" y="68" width="6" height="6" fill="#f8fafc"/>
  <!-- Main Office Building -->
  <rect x="22" y="24" width="48" height="80" rx="4" fill="#0284c7"/>
  <!-- Windows Grid -->
  <g fill="#7dd3fc">
    <rect x="30" y="32" width="8" height="8" rx="1"/>
    <rect x="44" y="32" width="8" height="8" rx="1"/>
    <rect x="56" y="32" width="8" height="8" rx="1"/>
    <rect x="30" y="46" width="8" height="8" rx="1"/>
    <rect x="44" y="46" width="8" height="8" rx="1"/>
    <rect x="56" y="46" width="8" height="8" rx="1"/>
    <rect x="30" y="60" width="8" height="8" rx="1"/>
    <rect x="44" y="60" width="8" height="8" rx="1"/>
    <rect x="56" y="60" width="8" height="8" rx="1"/>
    <rect x="30" y="74" width="8" height="8" rx="1"/>
    <rect x="44" y="74" width="8" height="8" rx="1"/>
    <rect x="56" y="74" width="8" height="8" rx="1"/>
  </g>
  <!-- Glass entrance door -->
  <rect x="40" y="88" width="14" height="16" rx="2" fill="#1e293b"/>
  <rect x="42" y="90" width="10" height="14" rx="1" fill="#bae6fd"/>
  <!-- Antenna on top -->
  <line x1="46" y1="16" x2="46" y2="24" stroke="#0369a1" stroke-width="2.5"/>
  <circle cx="46" cy="16" r="2" fill="#ef4444"/>
