<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Head with hair bun -->
  <circle cx="60" cy="26" r="10" fill="#fed7aa"/>
  <circle cx="60" cy="15" r="4.5" fill="#854d0e"/>
  <path d="M50 24 c0 -8 20 -8 20 0 z" fill="#854d0e"/>
  <!-- Torso in dress -->
  <path d="M56 36 l-4 18 h16 l-4 -18 z" fill="#ec4899"/>
  <!-- Flared dance skirt / tutu -->
  <path d="M46 54 c-16 14 -10 22 4 22 h20 c14 0 20 -8 4 -22 z" fill="#f472b6"/>
  <!-- Arms raised gracefully in arc -->
  <path d="M54 38 c-14 -12 -18 -4 -22 10" fill="none" stroke="#fed7aa" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M66 38 c14 -12 18 -4 22 10" fill="none" stroke="#fed7aa" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Legs dancing on tiptoes -->
  <path d="M56 76 l-2 24 l6 4" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 76 l10 16 l6 -2" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>
  <!-- Ballet pointes shoes -->
  <ellipse cx="60" cy="104" rx="3" ry="1.5" fill="#ec4899"/>
  <ellipse cx="80" cy="92" rx="3" ry="1.5" fill="#ec4899"/>
  <!-- Sparkles around dancer -->
  <path d="M26 30 l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2 z" fill="#fbbf24"/>
  <path d="M92 48 l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2 z" fill="#fbbf24"/>
</svg>
