<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Chair Backrest -->
  <rect x="34" y="24" width="52" height="34" rx="6" fill="#0284c7"/>
  <rect x="40" y="30" width="40" height="22" rx="4" fill="#38bdf8"/>
  <!-- Backrest poles -->
  <line x1="42" y1="58" x2="42" y2="68" stroke="#0369a1" stroke-width="4"/>
  <line x1="78" y1="58" x2="78" y2="68" stroke="#0369a1" stroke-width="4"/>
  <!-- Seat cushion -->
  <rect x="30" y="66" width="60" height="12" rx="4" fill="#0ea5e9"/>
  <!-- Chair legs -->
  <line x1="38" y1="78" x2="32" y2="100" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="82" y1="78" x2="88" y2="100" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="48" y1="78" x2="46" y2="94" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="72" y1="78" x2="74" y2="94" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Leg stretcher -->
  <line x1="34" y1="90" x2="86" y2="90" stroke="#94a3b8" stroke-width="2.5"/>
</svg>
