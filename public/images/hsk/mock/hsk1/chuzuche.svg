<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Ground Shadow -->
  <ellipse cx="60" cy="94" rx="46" ry="6" fill="#cbd5e1"/>
  <!-- Taxi Roof Sign -->
  <rect x="52" y="32" width="16" height="8" rx="2" fill="#1e293b"/>
  <rect x="54" y="34" width="12" height="4" rx="1" fill="#f59e0b"/>
  <!-- Car Cabin / Roof -->
  <path d="M34 56 l10 -16 h32 l14 16 z" fill="#fbbf24"/>
  <!-- Windows -->
  <path d="M38 54 l7 -12 h12 v12 z" fill="#38bdf8"/>
  <path d="M62 54 v-12 h16 l10 12 z" fill="#38bdf8"/>
  <!-- Car Lower Body -->
  <rect x="16" y="54" width="88" height="26" rx="6" fill="#f59e0b"/>
  <!-- Chequer Pattern line -->
  <line x1="20" y1="67" x2="100" y2="67" stroke="#1e293b" stroke-width="4" stroke-dasharray="6,4"/>
  <!-- Headlights & Taillights -->
  <rect x="16" y="60" width="4" height="6" rx="1" fill="#ef4444"/>
  <rect x="100" y="60" width="4" height="6" rx="1" fill="#fef08a"/>
  <!-- Wheels -->
  <circle cx="36" cy="80" r="12" fill="#1e293b"/>
  <circle cx="36" cy="80" r="5" fill="#94a3b8"/>
  <circle cx="84" cy="80" r="12" fill="#1e293b"/>
  <circle cx="84" cy="80" r="5" fill="#94a3b8"/>
</svg>
