  <line x1="50" y1="36" x2="84" y2="36" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="44" x2="66" y2="44" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
