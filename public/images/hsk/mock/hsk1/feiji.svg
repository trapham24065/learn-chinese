<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#f8fafc"/>
  <!-- Airplane body flying upward-right -->
  <g transform="translate(60, 60) rotate(-35) translate(-60, -60)">
    <!-- Wings -->
    <path d="M54 52 l-36 24 v8 l36 -16 z" fill="#0284c7"/>
    <path d="M66 52 l36 24 v8 l-36 -16 z" fill="#0369a1"/>
    <!-- Tail Fin & Stabilizers -->
    <path d="M58 88 l-14 12 v4 l14 -6 z" fill="#0284c7"/>
    <path d="M62 88 l14 12 v4 l-14 -6 z" fill="#0369a1"/>
    <path d="M58 82 h4 v20 l-4 -6 z" fill="#dc2626"/>
    <!-- Fuselage Body -->
    <path d="M60 18 c-8 12 -10 60 -10 74 c0 6 4 10 10 10 s10 -4 10 -10 c0 -14 -2 -62 -10 -74 z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Cockpit Window -->
    <path d="M56 28 c2 -4 6 -4 8 0 v4 h-8 z" fill="#38bdf8"/>
    <!-- Cabin Windows -->
    <circle cx="60" cy="42" r="2" fill="#38bdf8"/>
    <circle cx="60" cy="50" r="2" fill="#38bdf8"/>
    <circle cx="60" cy="58" r="2" fill="#38bdf8"/>
    <circle cx="60" cy="66" r="2" fill="#38bdf8"/>
    <circle cx="60" cy="74" r="2" fill="#38bdf8"/>
  </g>
</svg>
