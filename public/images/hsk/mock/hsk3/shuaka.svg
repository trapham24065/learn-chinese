<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pos_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#pos_bg)"/>
  <!-- POS Terminal -->
  <rect x="36" y="24" width="48" height="74" rx="8" fill="#1e293b"/>
  <!-- Screen -->
  <rect x="42" y="32" width="36" height="20" rx="3" fill="#38bdf8"/>
  <rect x="46" y="38" width="16" height="3" rx="1" fill="#0369a1"/>
  <rect x="46" y="44" width="24" height="2" rx="1" fill="#0369a1"/>
  <!-- Keypad buttons -->
  <circle cx="48" cy="62" r="2.5" fill="#64748b"/>
  <circle cx="60" cy="62" r="2.5" fill="#64748b"/>
  <circle cx="72" cy="62" r="2.5" fill="#64748b"/>
  <circle cx="48" cy="72" r="2.5" fill="#64748b"/>
  <circle cx="60" cy="72" r="2.5" fill="#64748b"/>
  <circle cx="72" cy="72" r="2.5" fill="#64748b"/>
  <circle cx="48" cy="82" r="2.5" fill="#ef4444"/>
  <circle cx="60" cy="82" r="2.5" fill="#eab308"/>
  <circle cx="72" cy="82" r="2.5" fill="#22c55e"/>
  <!-- Swiping Card (tilted) -->
  <g transform="rotate(-20 50 20)">
    <rect x="35" y="16" width="48" height="30" rx="4" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="35" y="22" width="48" height="6" fill="#1d4ed8"/>
    <rect x="40" y="34" width="10" height="6" rx="1" fill="#fbbf24"/>
  </g>
</svg>
